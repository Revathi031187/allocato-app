# Databricks Apps runtime config.
# See: https://learn.microsoft.com/en-us/azure/databricks/dev-tools/databricks-apps/app-runtime
#
# Option A - App resources (recommended): In the Apps UI add resources with keys
#   genie-space, microsoft-app-id, microsoft-app-password and use app.yaml.with-resources.
#
# Option B - .env file: No resources needed. Put a .env file in the same folder as app.py
#   in the workspace with GENIE_SPACE_ID, MICROSOFT_APP_ID, MICROSOFT_APP_PASSWORD.
#   DATABRICKS_HOST and DATABRICKS_APP_PORT are set automatically by the platform.
command: ['python', 'app.py']
